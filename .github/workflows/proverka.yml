name: Проверки

on:
  push:
    branches: [main]
  pull_request:

jobs:
  proverka:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Шапка навыка разбирается и не несёт мёртвых полей
        run: |
          python3 - <<'PY'
          import yaml
          s = open('skill/SKILL.md', encoding='utf-8').read()
          assert s.startswith('---\n'), 'нет шапки'
          d = yaml.safe_load(s[4:s.find('\n---', 4) + 1])
          assert d.get('name') == 'agent-loop', 'имя не то'
          assert 'triggers' not in d, 'мёртвое поле triggers'
          assert 'when_to_use' in d, 'нет when_to_use — фразы вызова не сработают'
          assert d.get('disallowed-tools') == ['AskUserQuestion'], 'закрыта должна быть только родная модалка'
          print('шапка в порядке, полей', len(d))
          PY

      - name: Раздел первого тика лежит там, куда навык за ним ходит
        run: |
          test -f skill/sections/first-tick.md
          grep -q 'skills/agent-loop/sections/first-tick.md' skill/SKILL.md

      # Потолок навык ставит себе сам (§11: 3100 токенов тела) — здесь он проверяется, а не просто заявлен.
      - name: Влезает в бюджет — 3100 токенов тела, 3500 файла целиком
        run: |
          pip install -q tiktoken
          python3 - <<'PY'
          import tiktoken, sys
          enc = tiktoken.get_encoding('cl100k_base')
          s = open('skill/SKILL.md', encoding='utf-8').read()
          body = s.split('---', 2)[2]
          nb, nf = len(enc.encode(body)), len(enc.encode(s))
          print('токенов: тело', nb, 'файл', nf)
          bad = nb > 3100 or nf > 3500
          if bad:
              print(f'::error::Навык вырос: тело {nb} (потолок 3100), файл {nf} (потолок 3500)')
          sys.exit(1 if bad else 0)
          PY

      # Правила, которые стоили дороже всего. Пропадёт любое — сборка красная.
      - name: Несущие правила на месте
        run: |
          python3 - <<'PY'
          import re, sys
          s = re.sub(r'\s+', ' ', open('skill/SKILL.md', encoding='utf-8').read())
          нужно = {
            'git add по одному файлу': 'as SEPARATE commands',
            'git add -A под запретом': '`git add -A` — never',
            'доказательство постановки': 'prove it started',
            'снять расписание': 'remove the schedule',
            'три исхода': 'NOT VERIFIED',
            'зрячий зонд': 'until the probe has proven it can see',
            'вопрос в состояние': 'write the question into the state and the report',
            'ждущий пункт с тремя полями': '[~] ждёт: <what> · проверить после: <time> · срок вышел: <what you do>',
            'регламент не отменяет защиту': 'It does NOT outrank',
            'пробуждение без ручной правки': 'Do not edit files yourself in a wake',
            'потолок живых рук': 'six hands alive at once',
            'архив состояния': 'More than three tick records',
            'копия перед разрушительным': 'first a copy, its path into the state',
            'пять запретных команд git': '`git checkout --`, `git clean`, `git reset --hard`, `git stash`, `git push --force` — never',
          }
          плохо = [k for k, v in нужно.items() if v not in s]
          for k in плохо:
              print(f'::error::Пропало правило: {k}')
          sys.exit(1 if плохо else 0)
          PY

      # Контроль: проверка выше обязана УМЕТЬ краснеть, иначе её зелёное пустое.
      - name: Та же проверка на изувеченной копии обязана покраснеть
        run: |
          python3 - <<'PY'
          import re, sys
          s = open('skill/SKILL.md', encoding='utf-8').read().replace('Do not edit files yourself in a wake', 'ВЫРЕЗАНО')
          s = re.sub(r'\s+', ' ', s)
          if 'Do not edit files yourself in a wake' in s:
              print('::error::Проверка СЛЕПА: вырезанное правило всё ещё находится')
              sys.exit(1)
          print('контроль сработал: на изувеченной копии правило не найдено ✅')
          PY
